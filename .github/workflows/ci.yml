
name: CTM CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and Security Checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Security scan with Bandit
        run: python -m bandit -r ctm adapters -ll

      - name: Type check with Mypy
        run: python -m mypy ctm adapters

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel

      - name: Install wheel in a clean environment and smoke-test CLI
        run: |
          python -m venv "$RUNNER_TEMP/ctm-wheel-venv"
          "$RUNNER_TEMP/ctm-wheel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ctm-wheel-venv/bin/ctm" --help
          "$RUNNER_TEMP/ctm-wheel-venv/bin/ctm" \
            --input-dir "$GITHUB_WORKSPACE/mock_inputs" \
            --format sarif > "$RUNNER_TEMP/ctm-report.sarif"
          "$RUNNER_TEMP/ctm-wheel-venv/bin/python" -c \
            "import json, pathlib; report=json.loads(pathlib.Path('$RUNNER_TEMP/ctm-report.sarif').read_text()); assert report['version'] == '2.1.0'; assert report['runs'][0]['results']"
